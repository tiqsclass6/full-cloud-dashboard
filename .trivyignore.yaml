# Accepted Trivy risks (local/scripts/security-scan.sh); each expires at expired_at and then fails the gate again.

misconfigurations:
  - id: AWS-0031
    paths: ["envs/dev/ecr.tf", "ecr.tf"]
    statement: >-
      ECR tags are mutable in dev only (var.ecr_tag_mutability), so a demo rebuild can keep its
      version. Staging and prod set IMMUTABLE.
    expired_at: 2027-04-30

  - id: AWS-0040
    statement: >-
      The EKS API endpoint is public but restricted to the operator's /32 (api_allowed_cidrs,
      validated). The environment is ephemeral; production would be private-only behind a VPN.
    expired_at: 2027-04-30

  - id: AWS-0041
    statement: >-
      Reported on the EKS module's default (0.0.0.0/0) when the module is evaluated on its own.
      This project always passes api_allowed_cidrs, a single validated /32.
    expired_at: 2027-04-30

  - id: AWS-0104
    statement: >-
      EKS node security group egress (module default). Nodes reach ECR, Docker Hub and quay.io
      through the NAT gateway; pod egress is restricted by Kubernetes NetworkPolicies instead.
    expired_at: 2027-04-30

