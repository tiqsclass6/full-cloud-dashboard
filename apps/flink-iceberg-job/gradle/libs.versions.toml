[versions]
flink = "2.1.3"
flink-kafka = "5.0.0-2.1"
iceberg = "1.12.0"
avro = "1.12.2"
hadoop = "3.4.2"
jackson = "2.22.4"
slf4j = "2.0.20"
junit = "6.1.3"
assertj = "3.27.7"
shadow = "9.6.1"

[libraries]
flink-streaming-java = { module = "org.apache.flink:flink-streaming-java", version.ref = "flink" }
flink-clients = { module = "org.apache.flink:flink-clients", version.ref = "flink" }
flink-table-common = { module = "org.apache.flink:flink-table-common", version.ref = "flink" }
flink-table-runtime = { module = "org.apache.flink:flink-table-runtime", version.ref = "flink" }
flink-connector-base = { module = "org.apache.flink:flink-connector-base", version.ref = "flink" }
flink-connector-kafka = { module = "org.apache.flink:flink-connector-kafka", version.ref = "flink-kafka" }
flink-test-utils = { module = "org.apache.flink:flink-test-utils", version.ref = "flink" }
iceberg-flink-runtime = { module = "org.apache.iceberg:iceberg-flink-runtime-2.1", version.ref = "iceberg" }
iceberg-aws-bundle = { module = "org.apache.iceberg:iceberg-aws-bundle", version.ref = "iceberg" }
avro = { module = "org.apache.avro:avro", version.ref = "avro" }
hadoop-client-api = { module = "org.apache.hadoop:hadoop-client-api", version.ref = "hadoop" }
hadoop-client-runtime = { module = "org.apache.hadoop:hadoop-client-runtime", version.ref = "hadoop" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
