[project]
name = "mcp-platform-tools"
version = "0.1.0"
description = "Read-only MCP tools for the lakehouse platform (metrics, logs, Kubernetes, Kafka, Flink, Iceberg, Argo CD, runbooks)"
requires-python = ">=3.12"
# Direct dependencies; requirements.txt is the hash-locked closure built from requirements.in.
dependencies = ["mcp==2.3.0", "kubernetes==37.0.1", "prometheus-client==0.26.0", "uvicorn==0.54.0"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q -p no:cacheprovider"
