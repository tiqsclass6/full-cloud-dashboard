[project]
name = "lakehouse-jobs"
version = "0.1.0"
description = "PySpark jobs for the lakehouse: Iceberg maintenance and aggregates"
requires-python = ">=3.10"
dependencies = []  # pyspark is provided by the Spark image at runtime

[project.optional-dependencies]
test = ["pyspark>=4.1,<4.2", "pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
