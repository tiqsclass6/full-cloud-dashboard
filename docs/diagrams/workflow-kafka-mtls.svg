<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1060" viewBox="0 0 1600 1060" font-family="DejaVu Sans, sans-serif"><title>Kafka mutual TLS and certificate distribution</title><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7694b8"/></marker></defs><rect width="1600" height="1060" fill="#080f1d"/><rect x="40" y="40" width="5" height="80" rx="2" fill="#38bdf8"/><text x="65" y="70" font-size="14" fill="#38bdf8" font-weight="700">STREAMING LAKEHOUSE / PLATFORM WORKFLOWS</text><text x="65" y="113" font-size="31" fill="#f4f7fc" font-weight="700">Kafka mutual TLS and certificate distribution</text><text x="65" y="148" font-size="17" fill="#aabbd0" font-weight="400">No passwords: every client proves who it is with a certificate, and can do only what its ACLs allow</text><rect x="65" y="210" width="460" height="245" rx="16" fill="#111e30" stroke="#2a3e57"/><rect x="65" y="210" width="4" height="245" rx="2" fill="#38bdf8"/><text x="85" y="243" font-size="13" fill="#38bdf8" font-weight="700">01 / </text><text x="85" y="280" font-size="21" fill="#f1f5fb" font-weight="400">Two CAs</text><text x="85" y="315" font-size="16" fill="#aabbd0" font-weight="400">Strimzi runs a cluster CA (brokers) and a</text><text x="85" y="340" font-size="16" fill="#aabbd0" font-weight="400">clients CA (users), and renews them</text><path d="M528 333 L560 333" fill="none" stroke="#7694b8" stroke-width="2" marker-end="url(#a)"/><rect x="565" y="210" width="460" height="245" rx="16" fill="#111e30" stroke="#2a3e57"/><rect x="565" y="210" width="4" height="245" rx="2" fill="#38bdf8"/><rect x="962" y="222" width="42" height="42" rx="10" fill="#e5edf7"/><image x="967" y="227" width="32" height="32" xlink:href="data:image/svg+xml;base64,"/><text x="585" y="243" font-size="13" fill="#38bdf8" font-weight="700">02 / </text><text x="585" y="280" font-size="21" fill="#f1f5fb" font-weight="400">One KafkaUser per client</text><text x="585" y="315" font-size="16" fill="#aabbd0" font-weight="400">Certificate with CN=&lt;name&gt;; least-privilege</text><text x="585" y="340" font-size="16" fill="#aabbd0" font-weight="400">ACLs</text><path d="M1028 333 L1060 333" fill="none" stroke="#7694b8" stroke-width="2" marker-end="url(#a)"/><rect x="1065" y="210" width="460" height="245" rx="16" fill="#111e30" stroke="#2a3e57"/><rect x="1065" y="210" width="4" height="245" rx="2" fill="#38bdf8"/><text x="1085" y="243" font-size="13" fill="#38bdf8" font-weight="700">03 / </text><text x="1085" y="280" font-size="21" fill="#f1f5fb" font-weight="400">Distribute</text><text x="1085" y="315" font-size="16" fill="#aabbd0" font-weight="400">A Kyverno generate policy clones labelled</text><text x="1085" y="340" font-size="16" fill="#aabbd0" font-weight="400">secrets into the client namespace and keeps</text><text x="1085" y="365" font-size="16" fill="#aabbd0" font-weight="400">them in sync</text><rect x="65" y="490" width="460" height="245" rx="16" fill="#111e30" stroke="#2a3e57"/><rect x="65" y="490" width="4" height="245" rx="2" fill="#a78bfa"/><rect x="462" y="502" width="42" height="42" rx="10" fill="#e5edf7"/><image x="467" y="507" width="32" height="32" xlink:href="data:image/svg+xml;base64,"/><text x="85" y="523" font-size="13" fill="#a78bfa" font-weight="700">04 / </text><text x="85" y="560" font-size="21" fill="#f1f5fb" font-weight="400">Clients connect</text><text x="85" y="595" font-size="16" fill="#aabbd0" font-weight="400">ingestion-service: Write events.raw. Flink</text><text x="85" y="620" font-size="16" fill="#aabbd0" font-weight="400">job: Read events.raw and its group</text><path d="M528 613 L560 613" fill="none" stroke="#7694b8" stroke-width="2" marker-end="url(#a)"/><text x="65" y="478" font-size="12" fill="#7694b8" font-weight="700">CONTINUED · 4–5</text><rect x="565" y="490" width="460" height="245" rx="16" fill="#111e30" stroke="#2a3e57"/><rect x="565" y="490" width="4" height="245" rx="2" fill="#a78bfa"/><rect x="962" y="502" width="42" height="42" rx="10" fill="#e5edf7"/><image x="967" y="507" width="32" height="32" xlink:href="data:image/svg+xml;base64,"/><text x="585" y="523" font-size="13" fill="#a78bfa" font-weight="700">05 / </text><text x="585" y="560" font-size="21" fill="#f1f5fb" font-weight="400">One listener</text><text x="585" y="595" font-size="16" fill="#aabbd0" font-weight="400">Port 9093, TLS with client authentication</text><text x="585" y="620" font-size="16" fill="#aabbd0" font-weight="400">only; a network policy admits only the apps</text><text x="585" y="645" font-size="16" fill="#aabbd0" font-weight="400">namespace</text><text x="65" y="770" font-size="13" fill="#34d399" font-weight="700">RECORDED RUN EVIDENCE / NOT A LIVE STATUS CHECK</text><text x="65" y="805" font-size="16" fill="#aabbd0" font-weight="400">10/10 · Kafka security tests on EKS: allowed and refused per · identity · 0 · plaintext or unauthenticated listeners · 3 · identities: ingestion, Flink job,</text><text x="65" y="830" font-size="16" fill="#aabbd0" font-weight="400">admin toolbox · ! · Not yet tested: a real CA renewal end to end (the copy and sync were tested by deleting and tampering with a copied secret).</text><text x="65" y="1025" font-size="12" fill="#7694b8" font-weight="400">Details: SECURITY.md, helm/charts/kafka-cluster/values.yaml</text></svg>