# Argo CD for kind (chart argo/argo-cd 10.11.6, v3.5.6), installed by local/scripts/gitops-bootstrap.sh.
global:
  domain: argocd.local

configs:
  params:
    server.insecure: true                  # plain HTTP behind kubectl port-forward, local only
    controller.diff.server.side: "true"    # server-side diff: fewer false "out of sync" results
  cm:
    timeout.reconciliation: 60s            # poll Git every minute (no webhooks from in-cluster Gitea)
    admin.enabled: true
    # Kyverno policies are healthy once Kyverno enforces them, so the next sync wave starts only then.
    resource.customizations.health.policies.kyverno.io_ValidatingPolicy: &kyvernoPolicyHealth |
      hs = {status = "Progressing", message = "Waiting for Kyverno to enforce the policy"}
      local cs = obj.status and obj.status.conditionStatus
      if cs and cs.ready == true then
        hs.status = "Healthy"
        hs.message = "Kyverno enforces the policy"
      elseif cs and cs.conditions then
        for _, c in ipairs(cs.conditions) do
          if c.status ~= "True" then hs.message = c.type .. ": " .. (c.message or "not ready") end
        end
      end
      return hs
    resource.customizations.health.policies.kyverno.io_ImageValidatingPolicy: *kyvernoPolicyHealth
    resource.customizations.health.policies.kyverno.io_GeneratingPolicy: *kyvernoPolicyHealth

dex:
  enabled: false
notifications:
  enabled: false

# Metrics for the sync and health dashboard and the GitOps alerts (observability/).
controller:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {memory: 1Gi}
repoServer:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}
server:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
applicationSet:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}
