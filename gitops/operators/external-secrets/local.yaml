# External Secrets Operator (chart 2.14.0), installed for parity: locally no secret store is configured.
installCRDs: true
resources:
  requests: {cpu: 20m, memory: 64Mi}
  limits: {memory: 256Mi}
webhook:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
certController:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}
# Sync status metrics (alert ExternalSecretNotReady in helm/charts/observability).
serviceMonitor:
  enabled: true
