# Loki (chart grafana/loki 7.5.0, Loki 3.6) in monolithic mode with filesystem storage; volumes on gp3.
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # single tenant; reachable only inside the cluster
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 72h
    allow_structured_metadata: true
    volume_enabled: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 1
  persistence:
    size: 20Gi
    storageClass: gp3
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 768Mi}

# Monolithic mode: none of the scalable components, caches or test helpers.
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
gateway: {enabled: false}
minio: {enabled: false}

monitoring:
  serviceMonitor:
    enabled: true
