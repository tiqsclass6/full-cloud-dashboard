{{- $ctx := dict "root" $ "name" "ai-ops" -}}
# RBAC for these comes from helm/charts/ai-ops-access.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.mcp.serviceAccount }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.agent.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  {{- with .Values.agent.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false     # ops-agent never talks to the Kubernetes API
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.control.serviceAccount }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
{{- if .Values.hermes.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.hermes.serviceAccount.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  {{- with .Values.hermes.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false     # Hermes never talks to the Kubernetes API
{{- end }}
