{{- if .Values.metrics.enabled }}
{{- $ctx := dict "root" $ "name" .Values.name -}}
# Scrapes the JobManager and every TaskManager of the job (Flink's Prometheus reporter).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: {{ .Values.name }}
      type: flink-native-kubernetes
  podMetricsEndpoints:
    - port: metrics
      interval: {{ .Values.metrics.interval }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_component]
          targetLabel: component          # jobmanager | taskmanager
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
{{- end }}
