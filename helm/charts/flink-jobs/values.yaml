# Defaults match the local kind deployment; environment files in helm/values override them.
namespace: apps
name: events-to-iceberg

image:
  repository: lakehouse/flink-iceberg-job
  tag: ""          # empty: use global.imageTag

flinkVersion: v2_1
serviceAccount: flink
# Kafka identity (a KafkaUser in helm/charts/kafka-cluster); its certificate is mounted for mutual TLS.
kafkaUser: events-to-iceberg
parallelism: 2
taskSlots: 2
# savepoint: the operator stops the job with a savepoint on every spec change and restores from it.
upgradeMode: savepoint
restartFailedJob: true
# The retry window: a copy of an event_id arriving later than this is stored again (ingestion README, Retry contract).
dedupeTtlMinutes: 60

checkpointing:
  interval: 10s          # also bounds table freshness (the sink commits once per checkpoint)
  minPause: 2s
  timeout: 2min
  tolerableFailures: 3

# hashmap takes full snapshots; rocksdb with incremental checkpoints scales to large de-dup state.
stateBackend:
  type: hashmap
  incremental: false

storage:
  checkpointsDir: s3://checkpoints/flink/checkpoints
  savepointsDir: s3://checkpoints/flink/savepoints

# Static keys for the local S3 stand-in only (throwaway). Leave empty on AWS: IRSA supplies credentials.
s3StaticKeys:
  accessKey: ""
  secretKey: ""

jobManager:
  memory: 1024m
  cpu: 0.5
  # A leader and a standby (needs highAvailability): if the leader's node fails, the standby takes over in
  # seconds instead of the job waiting for Kubernetes to evict the pod (5 minutes; docs/chaos/README.md).
  replicas: 2
  # Keep the JobManagers in different zones, or one zone outage takes both.
  zoneSpread: DoNotSchedule
taskManager:
  memory: 2048m
  cpu: 1
  # How long a requested TaskManager may take to register before Flink releases it and asks for another (default
  # 5 min). After a node failure the first replacement can land on the dead node, which Kubernetes has not yet
  # marked NotReady; with 5 minutes the job then idles that long (zone outage, docs/chaos/README.md).
  registrationTimeout: 90s
  # Idle TaskManagers kept running (slotmanager.redundant-taskmanager-num): when a TaskManager or its node fails,
  # the job restarts on their slots instead of waiting for a new pod. Each costs a full TaskManager.
  spares: 1
  # Prefer different zones for the TaskManagers, so the spare survives the zone it would replace. Soft, so that a
  # replacement is never left Pending for want of a zone.
  zoneSpread: ScheduleAnyway

# Failover and FAILED-job recovery resume from the latest checkpoint; required by restartFailedJob.
highAvailability:
  enabled: true
  storageDir: s3://checkpoints/flink/ha

extraFlinkConfiguration: {}

# Prometheus metrics (Flink's Prometheus reporter) and the PodMonitor that scrapes them.
metrics:
  enabled: true
  port: 9249
  interval: 15s
