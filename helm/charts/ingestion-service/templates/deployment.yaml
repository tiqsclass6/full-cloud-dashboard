{{- $ctx := dict "root" $ "name" "ingestion-service" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "lakehouse.selectorLabels" $ctx | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "lakehouse.labels" $ctx | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: {{ .Values.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "lakehouse.selectorLabels" $ctx | nindent 14 }}
      securityContext:
        {{- include "lakehouse.podSecurityContext" (dict "uid" 10001) | nindent 8 }}
      containers:
        - name: ingestion-service
          image: {{ include "lakehouse.image" (dict "root" $ "image" .Values.image) }}
          imagePullPolicy: {{ include "lakehouse.imagePullPolicy" $ctx }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.global.kafka.bootstrapServers | quote }}
            - name: SCHEMA_REGISTRY_URL
              value: {{ .Values.global.schemaRegistry.url | quote }}
            - name: TOPIC
              value: {{ .Values.topic | quote }}
            - name: MAX_IN_FLIGHT
              value: {{ .Values.maxInFlight | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.javaOpts | quote }}
            {{- include "lakehouse.kafkaClientEnv" (dict "root" $ "prefix" "PRODUCER_" "user" .Values.kafkaUser) | nindent 12 }}
            {{- with .Values.tracing }}
            {{- if .enabled }}
            # OpenTelemetry Java agent (baked into the image); trace context travels in Kafka headers.
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/opt/otel/opentelemetry-javaagent.jar
            - name: OTEL_SERVICE_NAME
              value: ingestion-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            - name: OTEL_TRACES_SAMPLER
              value: parentbased_traceidratio
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .sampleRatio | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: none                  # metrics stay on Micrometer/Prometheus
            - name: OTEL_LOGS_EXPORTER
              value: none                  # logs are collected from stdout by Alloy
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.namespace.name={{ $.Values.namespace }},k8s.pod.name=$(POD_NAME),deployment.environment={{ $.Values.global.environment }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "lakehouse.containerSecurityContext" $ctx | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "lakehouse.kafkaClientVolumeMounts" $ctx | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        {{- include "lakehouse.kafkaClientVolumes" (dict "root" $ "user" .Values.kafkaUser) | nindent 8 }}
