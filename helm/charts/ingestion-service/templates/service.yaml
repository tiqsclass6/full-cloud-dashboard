{{- $ctx := dict "root" $ "name" "ingestion-service" -}}
apiVersion: v1
kind: Service
metadata:
  name: ingestion-service
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
spec:
  selector:
    {{- include "lakehouse.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
