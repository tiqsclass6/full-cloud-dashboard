# Defaults match the local kind deployment; environment files in helm/values override them.
namespace: kafka
clusterName: lakehouse
monitoringNamespace: monitoring

# Locally one dual-role pool; AWS has separate controller and broker pools. Renaming a live pool is a migration.
nodePools:
  - name: dual-role
    replicas: 3
    roles: [controller, broker]
    storage:
      size: 5Gi
      storageClass: ""
      kraftMetadata: shared
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 1536Mi
    heap: 512m

# Mutual TLS only: every client is a KafkaUser limited by its ACLs; no plaintext listener.
listeners:
  - name: tls
    port: 9093
    type: internal
    tls: true
    authentication:
      type: tls
    # Who may connect at all (Strimzi writes the NetworkPolicy); ACLs decide what each may do.
    networkPolicyPeers:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: apps
      - podSelector:
          matchLabels:
            app: kafka-admin

# kafka-admin is the operators' break-glass identity, used only by the admin toolbox.
authorization:
  type: simple
  superUsers:
    - CN=kafka-admin

# Kyverno (sync-kafka-client-secrets) clones secrets with this label into the client namespaces.
shareLabel: lakehouse.io/share-with-clients

# One KafkaUser per client, least privilege; Strimzi issues and renews each certificate.
users:
  ingestion-service:
    shareWithClients: true
    acls:
      - resource: {type: topic, name: events.raw, patternType: literal}
        operations: [Write, Describe]
  events-to-iceberg:          # the Flink job
    shareWithClients: true
    acls:
      - resource: {type: topic, name: events.raw, patternType: literal}
        operations: [Read, Describe]
      - resource: {type: group, name: flink-events-to-iceberg, patternType: literal}
        operations: [Read, Describe]
  lakehouse-reconcile:        # the Spark reconcile: offset lookups only, no records
    shareWithClients: true
    acls:
      - resource: {type: topic, name: events.raw, patternType: literal}
        operations: [Describe]
      - resource: {type: group, name: flink-events-to-iceberg, patternType: literal}
        operations: [Describe]
  kafka-admin:                # super user (see authorization); stays in the kafka namespace
    shareWithClients: false
    acls: []

# Resources for the Strimzi-managed helpers (required by the require-requests-limits policy).
operatorResources:
  topicOperator:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  userOperator:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
  kafkaExporter:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 128Mi}

# Admin toolbox with the kafka-admin certificate (local/scripts/lib.sh kafka_cli).
adminToolbox:
  enabled: true
  image: quay.io/strimzi/kafka:1.3.0-kafka-4.3.1

config:
  default.replication.factor: 3
  min.insync.replicas: 2
  offsets.topic.replication.factor: 3
  transaction.state.log.replication.factor: 3
  transaction.state.log.min.isr: 2
  auto.create.topics.enable: false
  num.partitions: 6

metricsAllowList:
  - "kafka_server_.*"
  - "kafka_network_.*"
  - "kafka_controller_.*"
  - "kafka_log_.*"
  - "kafka_cluster_.*"
  - "kafka_coordinator_.*"
  - "kafka_server_brokertopicmetrics_.*"
  - "jvm_.*"
  - "process_.*"

# events.raw is keyed by source: 6 partitions; RF=3 and min.insync.replicas=2 survive one broker loss.
topics:
  events.raw:
    partitions: 6
    replicas: 3
    config:
      min.insync.replicas: "2"
      retention.ms: "604800000"
      compression.type: producer
  events.dlq:
    partitions: 3
    replicas: 3
    config:
      min.insync.replicas: "2"
      retention.ms: "2592000000"

podMonitors:
  enabled: true
