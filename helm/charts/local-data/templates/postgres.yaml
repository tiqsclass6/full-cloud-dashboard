{{- $ctx := dict "root" $ "name" "postgres" -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
data:
  init.sql: |
    {{- range .Values.postgres.databases }}
    CREATE DATABASE {{ . }};
    {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  clusterIP: None
  selector:
    {{- include "lakehouse.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "lakehouse.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lakehouse.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ include "lakehouse.image" (dict "root" $ "image" .Values.postgres.image) }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.credentials.postgres.user | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
