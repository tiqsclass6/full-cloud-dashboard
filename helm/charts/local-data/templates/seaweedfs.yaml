{{- $ctx := dict "root" $ "name" "seaweedfs" -}}
{{- $sw := .Values.seaweedfs -}}
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  selector:
    {{- include "lakehouse.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: s3
      port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      {{- include "lakehouse.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lakehouse.labels" $ctx | nindent 8 }}
    spec:
      containers:
        - name: seaweedfs
          image: {{ include "lakehouse.image" (dict "root" $ "image" $sw.image) }}
          args:
            - server
            - -dir=/data
            - -s3
            - -s3.port=8333
            - -s3.config=/etc/seaweedfs/s3.json
            - -master.volumeSizeLimitMB={{ $sw.volumeSizeLimitMB }}
            - -volume.max={{ $sw.maxVolumes }}
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml $sw.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
      volumes:
        - name: s3-config
          secret:
            secretName: s3-credentials
            items:
              - key: s3.json
                path: s3.json
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ $sw.storage }}
---
# Creates the buckets as a Sync hook (a Job's pod template is immutable); waves: -4 ns, -3 secrets/stores, -2 catalog, -1 buckets.
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-create-buckets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  annotations:
    # The buckets must exist before Flink's HA store starts.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 12
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: aws-cli
          image: {{ include "lakehouse.image" (dict "root" $ "image" .Values.awsCliImage) }}
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.global.aws.region | default "us-east-1" | quote }}
            - name: AWS_S3_ADDRESSING_STYLE
              value: path
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for b in {{ join " " $sw.buckets }}; do
                aws --endpoint-url http://s3:8333 s3api head-bucket --bucket "$b" 2>/dev/null \
                  || aws --endpoint-url http://s3:8333 s3 mb "s3://$b"
              done
              aws --endpoint-url http://s3:8333 s3 ls
