{{- $creds := .Values.credentials -}}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "lakehouse.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  POSTGRES_USER: {{ $creds.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $creds.postgres.password | quote }}
{{- range $creds.postgresSecretNamespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: {{ . }}
  labels:
    {{- include "lakehouse.labels" (dict "root" $ "name" "postgres") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  POSTGRES_USER: {{ $creds.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ $creds.postgres.password | quote }}
{{- end }}
{{- range $creds.s3SecretNamespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: s3-credentials
  namespace: {{ . }}
  labels:
    {{- include "lakehouse.labels" (dict "root" $ "name" "seaweedfs") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $creds.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $creds.s3.secretKey | quote }}
  {{- if eq . $.Values.namespace }}
  s3.json: |
    {
      "identities": [
        {
          "name": "lakehouse",
          "credentials": [
            { "accessKey": {{ $creds.s3.accessKey | quote }}, "secretKey": {{ $creds.s3.secretKey | quote }} }
          ],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]
        }
      ]
    }
  {{- end }}
{{- end }}
