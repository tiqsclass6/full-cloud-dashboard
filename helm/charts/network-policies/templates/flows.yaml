{{- $root := . -}}
{{- $ctx := dict "root" $ "name" "network-policies" -}}
{{- range $flow := concat .Values.flows .Values.extraFlows }}
{{- $to := $flow.to }}
{{- /* Egress side, in the source namespace (only our namespaces deny egress by default). */ -}}
{{- if and (hasKey $root.Values.namespaces $flow.from.namespace) (ne (toString $flow.egress) "false") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $flow.name }}-egress
  namespace: {{ $flow.from.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    {{- if $flow.from.podLabels }}
    matchLabels:
      {{- toYaml $flow.from.podLabels | nindent 6 }}
    {{- else }} {}
    {{- end }}
  policyTypes: [Egress]
  egress:
    - to:
        {{- if $to.cidr }}
        - ipBlock:
            cidr: {{ $to.cidr }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $to.namespace }}
          {{- with $to.podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- end }}
      ports:
        {{- range $to.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
{{- /* Ingress side, in the target namespace. */ -}}
{{- if and $to.namespace (hasKey $root.Values.namespaces $to.namespace) (ne (toString $flow.ingress) "false") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $flow.name }}-ingress
  namespace: {{ $to.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
spec:
  podSelector:
    {{- if $to.podLabels }}
    matchLabels:
      {{- toYaml $to.podLabels | nindent 6 }}
    {{- else }} {}
    {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $flow.from.namespace }}
          {{- with $flow.from.podLabels }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
          {{- end }}
      ports:
        {{- range $to.ports }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
{{- end }}
{{- end }}
