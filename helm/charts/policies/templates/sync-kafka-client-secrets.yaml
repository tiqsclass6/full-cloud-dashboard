{{- $ctx := dict "root" $ "name" "policies" -}}
{{- $k := .Values.kafkaSecrets -}}
# GeneratingPolicy: every create or update of a labelled Kafka secret refreshes its copies in the client namespaces.
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: sync-kafka-client-secrets
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  annotations:
    # With the namespaces, before any workload: Kyverno must enforce (and pin digests) from the first pod.
    argocd.argoproj.io/sync-wave: "-4"
    policies.kyverno.io/title: Distribute Kafka client certificates
    policies.kyverno.io/category: Secret distribution
    policies.kyverno.io/description: >-
      Copies the Kafka cluster CA certificate and the KafkaUser secrets labelled
      {{ $k.shareLabel }}=true from the {{ $k.sourceNamespace }} namespace into
      {{ join ", " $k.targetNamespaces }}, and keeps the copies in sync when Strimzi renews them.
spec:
  evaluation:
    generateExisting:
      enabled: true
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [secrets]
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: {{ $k.sourceNamespace }}
    objectSelector:
      matchLabels:
        {{ $k.shareLabel }}: "true"
  variables:
    # Only the name, type and data are copied: no owner references, no Strimzi labels.
    - name: copy
      expression: >-
        [{
          "apiVersion": "v1",
          "kind": "Secret",
          "metadata": {
            "name": object.metadata.name,
            "labels": {"app.kubernetes.io/managed-by": "kyverno", "lakehouse.io/copied-from": "{{ $k.sourceNamespace }}"}
          },
          "type": object.type,
          "data": object.data
        }]
  generate:
    {{- range $ns := $k.targetNamespaces }}
    - expression: generator.Apply("{{ $ns }}", variables.copy)
    {{- end }}
