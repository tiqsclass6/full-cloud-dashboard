{{- /* Each rule renders twice: Deny (Audit until enforce) in platform namespaces, and an -audit copy everywhere else. */ -}}
{{- $root := . -}}
{{- $v := .Values.validation -}}
{{- $ctx := dict "root" $ "name" "policies" -}}
{{- $platform := $v.platformNamespaces -}}
{{- $notAudited := concat $platform $v.auditExcludedNamespaces -}}

{{- $podRule := dict "apiGroups" (list "") "apiVersions" (list "v1") "operations" (list "CREATE" "UPDATE") "resources" (list "pods") -}}
{{- $svcRule := dict "apiGroups" (list "") "apiVersions" (list "v1") "operations" (list "CREATE" "UPDATE") "resources" (list "services") -}}
{{- $containers := dict "name" "containers" "expression" "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])" -}}

{{- $rules := list
  (dict "name" "require-requests-limits" "audit" true "match" $podRule "variables" (list $containers)
        "title" "Require CPU and memory requests and a memory limit"
        "description" "The scheduler needs requests to place pods; a memory limit stops one pod from starving a node."
        "expression" "variables.containers.all(c, has(c.resources) && has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests && has(c.resources.limits) && 'memory' in c.resources.limits)"
        "message" "every container needs resources.requests.cpu, resources.requests.memory and resources.limits.memory")
  (dict "name" "require-pinned-image-tags" "audit" true "match" $podRule "variables" (list $containers)
        "title" "Require pinned image versions"
        "description" "Images must carry an explicit tag or digest, and never :latest, so a rollout is reproducible."
        "expression" "variables.containers.all(c, c.image.contains('@sha256:') || (c.image.matches('.*:[^/:]+$') && !c.image.endsWith(':latest')))"
        "message" "image must be pinned to a tag (not :latest) or a digest")
  (dict "name" "restrict-image-registries" "audit" false "match" $podRule
        "variables" (list $containers (dict "name" "allowed" "expression" (toJson (concat $v.allowedImagePrefixes $v.extraAllowedImagePrefixes))))
        "title" "Allow images only from approved sources"
        "description" "Platform workloads run only images built by the platform or pinned upstream sources."
        "expression" "variables.containers.all(c, variables.allowed.exists(p, c.image.startsWith(p)))"
        "message" "image is not from an approved source (policies.validation.allowedImagePrefixes)")
  (dict "name" "restrict-service-types" "audit" true "match" $svcRule "variables" (list)
        "title" "No externally exposed Services"
        "description" "Platform Services are ClusterIP only. The one exception is an internal load balancer without node ports (AWS: the MCP endpoint AgentCore Gateway reaches inside the VPC); nothing is ever exposed outside the VPC."
        "expression" "!has(object.spec.type) || object.spec.type == 'ClusterIP' || (object.spec.type == 'LoadBalancer' && has(object.metadata.annotations) && 'service.beta.kubernetes.io/aws-load-balancer-scheme' in object.metadata.annotations && object.metadata.annotations['service.beta.kubernetes.io/aws-load-balancer-scheme'] == 'internal' && has(object.spec.allocateLoadBalancerNodePorts) && object.spec.allocateLoadBalancerNodePorts == false)"
        "message" "only ClusterIP Services, or internal load balancers without node ports, are allowed")
-}}

{{- range $rule := $rules }}
{{- $modes := list (dict "suffix" "" "actions" (list (ternary "Deny" "Audit" $v.enforce)) "operator" "In" "namespaces" $platform) }}
{{- if $rule.audit }}
{{- $modes = append $modes (dict "suffix" "-audit" "actions" (list "Audit") "operator" "NotIn" "namespaces" $notAudited) }}
{{- end }}
{{- range $mode := $modes }}
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: {{ $rule.name }}{{ $mode.suffix }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
  annotations:
    policies.kyverno.io/title: {{ $rule.title | quote }}
    policies.kyverno.io/description: {{ $rule.description | quote }}
spec:
  validationActions: {{ toJson $mode.actions }}
  evaluation:
    background:
      enabled: true          # existing resources are scanned and reported too
  matchConstraints:
    resourceRules:
      - {{ toJson $rule.match }}
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: {{ $mode.operator }}
          values: {{ toJson $mode.namespaces }}
  {{- with $rule.variables }}
  variables:
    {{- range . }}
    - name: {{ .name }}
      expression: {{ .expression | quote }}
    {{- end }}
  {{- end }}
  validations:
    - expression: {{ $rule.expression | quote }}
      message: {{ $rule.message | quote }}
{{- end }}
{{- end }}
