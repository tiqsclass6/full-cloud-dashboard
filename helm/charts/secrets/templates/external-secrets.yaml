{{- $ctx := dict "root" $ "name" "secrets" -}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.store.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.store.serviceAccount.name }}
            namespace: {{ .Values.store.serviceAccount.namespace }}
  # Only ExternalSecrets in the platform's namespaces may use this store.
  conditions:
    - namespaces:
        {{- range $name, $es := .Values.externalSecrets }}
        - {{ $es.namespace }}
        {{- end }}
{{- range $name, $es := .Values.externalSecrets }}
{{- include "lakehouse.required" (dict "root" $ "key" (printf "secrets.externalSecrets.%s.remoteKey" $name) "value" $es.remoteKey) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  namespace: {{ $es.namespace }}
  labels:
    {{- include "lakehouse.labels" $ctx | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $.Values.store.name }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
  data:
    {{- range $key, $property := $es.properties }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $es.remoteKey | quote }}
        property: {{ $property }}
    {{- end }}
{{- end }}
