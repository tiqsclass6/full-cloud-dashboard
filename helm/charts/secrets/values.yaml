# AWS only: synced from Secrets Manager by External Secrets (names from values/generated/<env>.yaml); nothing secret in Git.

store:
  name: aws-secrets-manager
  region: us-east-1
  serviceAccount:            # the operator's service account (IRSA role: read the platform's secrets only)
    name: external-secrets
    namespace: external-secrets

refreshInterval: 1h

externalSecrets:
  # RDS rotates the password; the Secret follows within refreshInterval, and pods pick it up on restart.
  schema-registry-db:
    namespace: data
    remoteKey: ""            # the RDS-managed secret's ARN (generated)
    properties: {username: username, password: password}
  grafana-admin:
    namespace: monitoring
    remoteKey: ""            # <env>/grafana-admin (generated)
    properties: {admin-user: admin-user, admin-password: admin-password}
